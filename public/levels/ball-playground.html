<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ball Playground — Bompers level</title>
    <!-- Optional preview kit: legend, labels, grid. The level works without it. -->
    <link rel="stylesheet" href="/level-kit/v2/preview.css" />
    <script src="/level-kit/v2/preview.js" defer></script>
  </head>
  <body>
    <svg
      id="level"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 3200 1400"
      data-level-format="2"
      data-level-id="ball-playground"
      data-title="Ball Playground"
      data-author="Bompers team"
      data-agent="claude"
      data-description="A playground for beach balls and go-karts: 26 balls of four sizes and 3 karts to drive on a long floor with a big ramp, a high shelf, a sliding platform, a pit, a cardboard patch to burn, an ice rink, a bowl and a wall to push against, with torch, freeze-ray and rocket drops."
      data-cell-size="4"
      data-gravity="1"
      data-match-duration="300"
      data-weapons="torch freeze-ray rocket-launcher"
      style="display: block; width: 100%; height: auto; background: #cfeaf7"
    >
      <title>Ball Playground</title>

      <!-- In-bounds area: leaving it eliminates the player (and pops a ball, which comes back). -->
      <rect data-role="bounds" x="0" y="0" width="3200" height="1400" fill="none" stroke="#d24b3a" />

      <!-- Ground: a stone floor in two halves around a pit, with a big ramp on the left. -->
      <rect data-role="terrain" data-material="stone" x="80" y="1200" width="1360" height="120" fill="#5a3f7a" />
      <rect data-role="terrain" data-material="stone" x="1680" y="1200" width="1440" height="120" fill="#5a3f7a" />
      <rect data-role="terrain" data-material="stone" x="1440" y="1320" width="240" height="40" fill="#5a3f7a" />
      <polygon data-role="terrain" data-material="stone" points="80,800 720,1200 80,1200" fill="#5a3f7a" />

      <!-- A high shelf over the ramp: balls on it roll off when pushed. -->
      <rect data-role="terrain" data-material="stone" x="320" y="560" width="400" height="32" fill="#5a3f7a" />

      <!-- The burnable patch (cardboard) and the ice rink, each under a weapon drop. -->
      <rect data-role="terrain" data-material="cardboard" x="1760" y="1184" width="320" height="16" fill="#c99a62" />
      <rect data-role="terrain" data-material="ice" data-color="frost" x="2320" y="1192" width="360" height="8" fill="#a8cfe6" />

      <!-- A bowl into the wall on the right, and the wall to push balls against. -->
      <polygon data-role="terrain" data-material="stone" points="2760,1200 3000,1040 3000,1200" fill="#5a3f7a" />
      <rect data-role="terrain" data-material="stone" x="3000" y="720" width="120" height="480" fill="#5a3f7a" />

      <!-- A sliding platform over the pit. -->
      <g data-motion="slide 400,0 5s">
        <rect data-role="terrain" data-material="stone" x="1080" y="880" width="240" height="24" fill="#5a3f7a" />
      </g>

      <!-- Beach balls (26), each rect a square: its side is the ball's diameter (32, 48, 64 or 96). -->
      <!-- On the shelf. -->
      <rect data-role="object" data-kind="ball" data-variant="beach" x="352" y="496" width="64" height="64" fill="#5f8f3e" />
      <rect data-role="object" data-kind="ball" data-variant="beach" x="448" y="512" width="48" height="48" fill="#5f8f3e" />
      <rect data-role="object" data-kind="ball" data-variant="beach" x="528" y="528" width="32" height="32" fill="#5f8f3e" />
      <rect data-role="object" data-kind="ball" data-variant="beach" x="592" y="512" width="48" height="48" fill="#5f8f3e" />
      <!-- Up the ramp, ready to roll. -->
      <rect data-role="object" data-kind="ball" data-variant="beach" x="120" y="776" width="48" height="48" fill="#5f8f3e" />
      <rect data-role="object" data-kind="ball" data-variant="beach" x="240" y="840" width="64" height="64" fill="#5f8f3e" />
      <!-- On the left floor. -->
      <rect data-role="object" data-kind="ball" data-variant="beach" x="760" y="1104" width="96" height="96" fill="#5f8f3e" />
      <rect data-role="object" data-kind="ball" data-variant="beach" x="880" y="1152" width="48" height="48" fill="#5f8f3e" />
      <rect data-role="object" data-kind="ball" data-variant="beach" x="944" y="1168" width="32" height="32" fill="#5f8f3e" />
      <rect data-role="object" data-kind="ball" data-variant="beach" x="992" y="1136" width="64" height="64" fill="#5f8f3e" />
      <rect data-role="object" data-kind="ball" data-variant="beach" x="1072" y="1152" width="48" height="48" fill="#5f8f3e" />
      <rect data-role="object" data-kind="ball" data-variant="beach" x="1136" y="1168" width="32" height="32" fill="#5f8f3e" />
      <rect data-role="object" data-kind="ball" data-variant="beach" x="1264" y="1152" width="48" height="48" fill="#5f8f3e" />
      <!-- Riding the sliding platform. -->
      <rect data-role="object" data-kind="ball" data-variant="beach" x="1112" y="832" width="48" height="48" fill="#5f8f3e" />
      <rect data-role="object" data-kind="ball" data-variant="beach" x="1216" y="848" width="32" height="32" fill="#5f8f3e" />
      <!-- In the pit. -->
      <rect data-role="object" data-kind="ball" data-variant="beach" x="1480" y="1256" width="64" height="64" fill="#5f8f3e" />
      <rect data-role="object" data-kind="ball" data-variant="beach" x="1576" y="1272" width="48" height="48" fill="#5f8f3e" />
      <!-- On the cardboard (to burn). -->
      <rect data-role="object" data-kind="ball" data-variant="beach" x="1800" y="1136" width="48" height="48" fill="#5f8f3e" />
      <rect data-role="object" data-kind="ball" data-variant="beach" x="1912" y="1120" width="64" height="64" fill="#5f8f3e" />
      <rect data-role="object" data-kind="ball" data-variant="beach" x="2040" y="1152" width="32" height="32" fill="#5f8f3e" />
      <!-- On the ice rink (to freeze and slide). -->
      <rect data-role="object" data-kind="ball" data-variant="beach" x="2352" y="1144" width="48" height="48" fill="#5f8f3e" />
      <rect data-role="object" data-kind="ball" data-variant="beach" x="2400" y="1128" width="64" height="64" fill="#5f8f3e" />
      <rect data-role="object" data-kind="ball" data-variant="beach" x="2528" y="1160" width="32" height="32" fill="#5f8f3e" />
      <!-- By the bowl and the wall. -->
      <rect data-role="object" data-kind="ball" data-variant="beach" x="2640" y="1104" width="96" height="96" fill="#5f8f3e" />
      <rect data-role="object" data-kind="ball" data-variant="beach" x="2896" y="1040" width="48" height="48" fill="#5f8f3e" />
      <rect data-role="object" data-kind="ball" data-variant="beach" x="2944" y="1008" width="32" height="32" fill="#5f8f3e" />

      <!-- Go-karts (3): stand beside one and press down to get in; drive into the balls. Each rect is 64 × 32. -->
      <rect data-role="object" data-kind="kart" data-variant="go-kart" x="2096" y="1168" width="64" height="32" fill="#5f8f3e" />
      <rect data-role="object" data-kind="kart" data-variant="go-kart" x="2248" y="1168" width="64" height="32" fill="#5f8f3e" />
      <rect data-role="object" data-kind="kart" data-variant="go-kart" x="656" y="528" width="64" height="32" fill="#5f8f3e" />

      <!-- Spawns: on the floor between the balls. -->
      <circle data-role="spawn" cx="1216" cy="1176" r="14" fill="#3f8f5f" />
      <circle data-role="spawn" cx="1360" cy="1176" r="14" fill="#3f8f5f" />
      <circle data-role="spawn" cx="2200" cy="1176" r="14" fill="#3f8f5f" />
      <circle data-role="spawn" cx="2600" cy="1176" r="14" fill="#3f8f5f" />

      <!-- Health pickups (4): on the high shelf, at the top of the ramp, down in the pit and on the wall top. -->
      <circle data-role="collectible" data-item="health" cx="520" cy="520" r="10" fill="#e0b62c" />
      <circle data-role="collectible" data-item="health" cx="200" cy="840" r="10" fill="#e0b62c" />
      <circle data-role="collectible" data-item="health" cx="1560" cy="1290" r="10" fill="#e0b62c" />
      <circle data-role="collectible" data-item="health" cx="3060" cy="690" r="10" fill="#e0b62c" />

      <!-- Weapon crates: the torch over the cardboard, the freeze ray over the ice, rockets in the middle. -->
      <circle data-role="drop" cx="1920" cy="160" r="12" fill="#c94f7c" />
      <circle data-role="drop" cx="2500" cy="160" r="12" fill="#c94f7c" />
      <circle data-role="drop" cx="1200" cy="160" r="12" fill="#c94f7c" />
    </svg>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slush Bowl — Bompers level</title>
    <!-- Optional preview kit: legend, labels, grid. The level works without it. -->
    <link rel="stylesheet" href="/level-kit/v2/preview.css" />
    <script src="/level-kit/v2/preview.js" defer></script>
  </head>
  <body>
    <svg
      id="level"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 2000 1200"
      data-level-format="2"
      data-level-id="slush-bowl"
      data-title="Slush Bowl"
      data-author="Bompers team"
      data-agent="claude-sonnet"
      data-description="A bowl where everything rolls to a drain in the middle: two 30 degree slopes with earth kickers, a cardboard lid over the drain, and an ice shelf above it."
      data-cell-size="4"
      data-gravity="1"
      data-match-duration="180"
      style="display: block; width: 100%; height: auto; background: #dbe7ee"
    >
      <title>Slush Bowl</title>

      <!-- Decoration (no data-role): soft background hills and slush drifts. -->
      <rect x="0" y="1040" width="2000" height="160" fill="#c3d3de" />
      <circle cx="300" cy="1080" r="160" fill="#cfdde6" />
      <circle cx="1700" cy="1080" r="160" fill="#cfdde6" />
      <circle cx="1000" cy="1140" r="220" fill="#cfdde6" />
      <rect x="860" y="300" width="280" height="8" fill="#b9cddb" />

      <rect data-role="bounds" x="40" y="20" width="1920" height="1160" fill="none" stroke="#d24b3a" stroke-width="3" stroke-dasharray="14 8" />

      <g id="terrain">
        <!-- Bowl halves: rim plateau, 30 degree slope, short flat toward the drain -->
        <polygon id="bowl-left" data-role="terrain" data-material="stone" data-color="plum" data-label="Left half" points="100,480 220,480 740,780 940,780 940,1000 100,1000" fill="#5a3f7a" />
        <polygon id="bowl-right" data-role="terrain" data-material="stone" data-color="plum" data-label="Right half" points="1060,780 1260,780 1780,480 1900,480 1900,1000 1060,1000" fill="#5a3f7a" />

        <!-- Earth kickers on the slopes -->
        <circle id="bump-left" data-role="terrain" data-material="earth" data-color="clay" data-effect="dust-burst" data-sound="crumble" cx="480" cy="650" r="60" fill="#c4673f" />
        <circle id="bump-right" data-role="terrain" data-material="earth" data-color="clay" data-effect="dust-burst" data-sound="crumble" cx="1520" cy="650" r="60" fill="#c4673f" />

        <!-- Cardboard guard blocks on the rim ends -->
        <rect id="guard-left" data-role="terrain" data-material="cardboard" data-color="cardboard" data-sound="crumble" x="100" y="400" width="60" height="80" fill="#c99a62" />
        <rect id="guard-right" data-role="terrain" data-material="cardboard" data-color="cardboard" data-sound="crumble" x="1840" y="400" width="60" height="80" fill="#c99a62" />

        <!-- Cardboard lid over the drain -->
        <rect id="drain-lid" data-role="terrain" data-material="cardboard" data-color="cardboard" data-sound="crumble" data-label="Drain lid" x="940" y="780" width="120" height="32" fill="#c99a62" />

        <!-- Stone ledges above the slopes -->
        <rect id="ledge-left" data-role="terrain" data-material="stone" data-color="slate" x="600" y="600" width="120" height="24" fill="#4f6178" />
        <rect id="ledge-right" data-role="terrain" data-material="stone" data-color="slate" x="1280" y="600" width="120" height="24" fill="#4f6178" />

        <!-- Ice shelf over the drain -->
        <rect id="ice-shelf" data-role="terrain" data-material="ice" data-color="frost" data-label="Ice shelf" x="860" y="420" width="280" height="32" fill="#a8cfe6" />
      </g>

      <g id="spawns">
        <circle data-role="spawn" cx="196" cy="456" r="14" fill="#3f8f5f" />
        <circle data-role="spawn" cx="1804" cy="456" r="14" fill="#3f8f5f" />
        <circle data-role="spawn" cx="660" cy="576" r="14" fill="#3f8f5f" />
        <circle data-role="spawn" cx="1340" cy="576" r="14" fill="#3f8f5f" />
      </g>

      <g id="drops">
        <circle data-role="drop" cx="1000" cy="100" r="12" fill="#c94f7c" />
        <circle data-role="drop" cx="500" cy="100" r="12" fill="#c94f7c" />
        <circle data-role="drop" cx="1500" cy="100" r="12" fill="#c94f7c" />
      </g>

      <g id="collectibles">
        <circle data-role="collectible" data-item="point-orb" cx="1000" cy="756" r="10" fill="#e0b62c" />
        <circle data-role="collectible" data-item="point-orb" cx="1000" cy="380" r="10" fill="#e0b62c" />
      </g>
    </svg>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Start Arena — Bompers level</title>
    <link rel="stylesheet" href="https://bompers.tom-fab.workers.dev/level-kit/v2/preview.css" />
    <script src="https://bompers.tom-fab.workers.dev/level-kit/v2/preview.js" defer></script>
  </head>
  <body>
    <svg
      id="level"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 1920 1440"
      data-level-format="2"
      data-level-id="start-arena"
      data-title="Start Arena"
      data-author="Bompers team"
      data-agent="claude"
      data-description="The start map: one floating main platform with two thin plateaus and a top perch above it, open side edges, no hazards. Earth crusts and edges and cardboard plateaus blast away; a stone core always stays and the top perch has an ice heart."
      data-cell-size="4"
      data-gravity="1"
      style="display: block; width: 100%; height: auto; background: #cfeaf7"
    >
      <title>Start Arena</title>
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#8fd6ff" />
          <stop offset="1" stop-color="#fff1cf" />
        </linearGradient>
      </defs>
      <!-- Decoration only (no data-role): sky, sun. -->
      <rect x="0" y="0" width="1920" height="1440" fill="url(#sky)" />
      <circle cx="1600" cy="240" r="96" fill="#fff6a8" />

      <!-- In-bounds area: 448+ units beside the main platform, 640 above the top perch, 192 below the keel. -->
      <rect
        id="bounds"
        data-role="bounds"
        x="32"
        y="32"
        width="1856"
        height="1376"
        fill="none"
        stroke="#d24b3a"
        stroke-width="4"
        stroke-dasharray="16 8"
      />

      <!-- Terrain. Cell 8. data-material sets behaviour (stone solid, earth/cardboard breakable, ice slippery); data-color only looks. Unbreakable wins where shapes overlap. -->
      <g id="terrain" stroke="#2b1d3a" stroke-width="5" stroke-linejoin="round">
        <!-- Main platform: stone core under every spawn, earth everywhere a blast should bite. The earth edges have a 128-unit vertical outer face: the wall-jump spot for recovering from a fall. -->
        <rect
          id="main-core"
          data-role="terrain"
          data-material="stone"
          data-label="Main core"
          x="576"
          y="992"
          width="768"
          height="96"
          fill="#5a3f7a"
        />
        <polygon
          id="main-underside"
          data-role="terrain"
          data-material="stone"
          points="576,1088 1344,1088 1216,1152 704,1152"
          fill="#5a3f7a"
        />
        <rect
          id="main-crust"
          data-role="terrain"
          data-material="earth"
          data-label="Main crust"
          x="480"
          y="960"
          width="960"
          height="32"
          fill="#c4673f"
        />
        <polygon
          id="main-edge-left"
          data-role="terrain"
          data-material="earth"
          data-label="Left edge"
          points="480,992 576,992 576,1136 480,1088"
          fill="#c4673f"
        />
        <polygon
          id="main-edge-right"
          data-role="terrain"
          data-material="earth"
          data-label="Right edge"
          points="1344,992 1440,992 1440,1088 1344,1136"
          fill="#c4673f"
        />
        <polygon
          id="main-keel"
          data-role="terrain"
          data-material="earth"
          data-label="Keel"
          points="704,1152 1216,1152 1056,1216 864,1216"
          fill="#c4673f"
        />

        <!-- Tier 1: two thin cardboard plateaus, 144 above the main surface (one jump; apex ≈ 250). -->
        <rect
          id="plateau-left"
          data-role="terrain"
          data-material="cardboard"
          data-color="cardboard"
          data-label="Left plateau"
          x="640"
          y="816"
          width="192"
          height="16"
          fill="#c99a62"
        />
        <rect
          id="plateau-right"
          data-role="terrain"
          data-material="cardboard"
          data-color="rose"
          data-label="Right plateau"
          x="1088"
          y="816"
          width="192"
          height="16"
          fill="#c95a86"
        />

        <!-- Tier 2: the top perch, 144 above tier 1 (288 above the main surface: climb a plateau, wall-jump or rocket-jump): earth wings around an ice heart (slippery, unbreakable). -->
        <rect
          id="perch-wings"
          data-role="terrain"
          data-material="earth"
          data-label="Top perch"
          x="864"
          y="672"
          width="192"
          height="16"
          fill="#c4673f"
        />
        <rect
          id="perch-heart"
          data-role="terrain"
          data-material="ice"
          data-color="frost"
          x="912"
          y="672"
          width="96"
          height="16"
          fill="#a8cfe6"
        />
      </g>

      <!-- Spawns: centre 24 above the surface, each above the stone core (never over a void, even when the earth is gone). -->
      <g id="spawns" stroke="#2b1d3a" stroke-width="3">
        <circle
          id="spawn-main-left"
          data-role="spawn"
          data-label="Main left"
          cx="608"
          cy="936"
          r="14"
          fill="#3f8f5f"
        />
        <circle
          id="spawn-main-right"
          data-role="spawn"
          data-label="Main right"
          cx="1312"
          cy="936"
          r="14"
          fill="#3f8f5f"
        />
        <circle
          id="spawn-plateau-left"
          data-role="spawn"
          data-label="Plateau left"
          cx="736"
          cy="792"
          r="14"
          fill="#3f8f5f"
        />
        <circle
          id="spawn-plateau-right"
          data-role="spawn"
          data-label="Plateau right"
          cx="1184"
          cy="792"
          r="14"
          fill="#3f8f5f"
        />
      </g>

      <!-- Sky drops for weapons and power-ups: over each landing zone; the outer two land on the breakable edges. -->
      <g id="drops" stroke="#2b1d3a" stroke-width="3">
        <circle
          id="drop-edge-left"
          data-role="drop"
          cx="528"
          cy="160"
          r="12"
          fill="#c94f7c"
        />
        <circle
          id="drop-plateau-left"
          data-role="drop"
          cx="736"
          cy="160"
          r="12"
          fill="#c94f7c"
        />
        <circle
          id="drop-centre"
          data-role="drop"
          cx="960"
          cy="160"
          r="12"
          fill="#c94f7c"
        />
        <circle
          id="drop-plateau-right"
          data-role="drop"
          cx="1184"
          cy="160"
          r="12"
          fill="#c94f7c"
        />
        <circle
          id="drop-edge-right"
          data-role="drop"
          cx="1392"
          cy="160"
          r="12"
          fill="#c94f7c"
        />
      </g>

      <!-- Collectibles: one safe, the rest a risk (high above the perch, off the edges, under the keel). -->
      <g id="collectibles" stroke="#2b1d3a" stroke-width="3">
        <circle
          id="orb-sheltered"
          data-role="collectible"
          data-item="point-orb"
          cx="960"
          cy="936"
          r="10"
          fill="#e0b62c"
        />
        <circle
          id="orb-perch-high"
          data-role="collectible"
          data-item="point-orb"
          cx="960"
          cy="552"
          r="10"
          fill="#e0b62c"
        />
        <circle
          id="orb-off-left"
          data-role="collectible"
          data-item="point-orb"
          cx="400"
          cy="824"
          r="10"
          fill="#e0b62c"
        />
        <circle
          id="orb-off-right"
          data-role="collectible"
          data-item="point-orb"
          cx="1520"
          cy="824"
          r="10"
          fill="#e0b62c"
        />
        <circle
          id="orb-under-keel"
          data-role="collectible"
          data-item="point-orb"
          cx="960"
          cy="1280"
          r="10"
          fill="#e0b62c"
        />
      </g>

      <!-- Headbutt resets: a spent dive gets its charge back. Off both edges (save a dive that
           missed, reach the outer orbs) and between the left plateau and the perch (air route up). -->
      <g id="headbutt-resets" stroke="#2b1d3a" stroke-width="3">
        <circle
          id="reset-off-left"
          data-role="collectible"
          data-item="dive-reset"
          cx="336"
          cy="760"
          r="12"
          fill="#5fe0ff"
        />
        <circle
          id="reset-off-right"
          data-role="collectible"
          data-item="dive-reset"
          cx="1584"
          cy="760"
          r="12"
          fill="#5fe0ff"
        />
        <circle
          id="reset-perch-route"
          data-role="collectible"
          data-item="dive-reset"
          cx="736"
          cy="640"
          r="12"
          fill="#5fe0ff"
        />
      </g>
    </svg>
  </body>
</html>
